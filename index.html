<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DaVinci</title>
<style>
  :root{
    --accent:#f4623c; --on-accent:#fff;             /* follows the glow color, set in applySettings() */
    --surface:rgb(16 16 20/.78); --line:rgb(255 255 255/.1); --line-strong:rgb(255 255 255/.2);
    --text:#ececf0; --text-dim:#a3a3ad; --field:rgb(255 255 255/.06);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden;font:13px/1.4 system-ui,sans-serif;color:var(--text)}
  ::selection{background:var(--accent);color:var(--on-accent)}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  /* frosted patch of sky behind the pictures; its shape is set as a mask in build() */
  #frost{position:fixed;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%}

  /* ---- settings button + panel, only shown in a browser (not as the wallpaper) ---- */
  #ui{pointer-events:none}                          /* selection boxes and handles while editing */
  #chip{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 40px);padding:7px 14px;border-radius:999px;
        border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(10px);box-shadow:0 6px 20px rgb(0 0 0/.3);
        font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
        transition:opacity .25s var(--ease),transform .35s var(--ease)}
  #chip b{color:var(--text);font-weight:600}
  #chip .dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--accent);vertical-align:1px}
  body:not(.editing) #chip{opacity:0;transform:translate(-50%,-8px)}
  /* while dragging on the picture, the panel gets out of the way */
  body.dragging #panel{opacity:.2;pointer-events:none}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  #fab{position:fixed;right:20px;bottom:20px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;
       border:1px solid var(--line-strong);background:var(--surface);backdrop-filter:blur(10px);cursor:pointer;
       box-shadow:0 6px 20px rgb(0 0 0/.35);transition:opacity .4s var(--ease),transform .4s var(--ease),background .15s}
  #fab:hover{background:rgb(40 40 48/.85)}
  #fab svg{transition:transform .5s var(--ease)}
  #fab[aria-expanded=true] svg{transform:rotate(90deg)}
  #fab.idle{opacity:0;transform:translateY(8px) scale(.9);pointer-events:none}

  #panel{position:fixed;right:20px;bottom:76px;width:min(300px,calc(100vw - 40px));max-height:calc(100vh - 100px);
         display:flex;flex-direction:column;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);
         backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 18px 50px rgb(0 0 0/.45);
         transform-origin:bottom right;transition:opacity .25s var(--ease),transform .35s var(--ease),visibility 0s}
  #panel:not(.open){opacity:0;transform:translateY(8px) scale(.96);visibility:hidden;transition-delay:0s,0s,.35s}
  #panel:focus{outline:none}
  #panel header{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 10px 16px}
  #panel h2{margin:0;font-size:14px;font-weight:600}
  #panel header p{margin:2px 0 0;color:var(--text-dim);font-size:12px}
  kbd{font:11px ui-monospace,monospace;padding:0 4px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;color:var(--text)}
  .icon-btn{margin-left:auto;flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:0;background:none;
            color:var(--text-dim);cursor:pointer}
  .icon-btn:hover{background:var(--field);color:var(--text)}

  #panel .body{overflow:auto;padding:0 16px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
  fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:12px 0 14px;display:grid;gap:12px;min-width:0}
  legend{padding:0;float:left;width:100%;margin-bottom:0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim)}
  legend + *{clear:both}
  /* a picture's section lights up when that picture is selected on the screen */
  fieldset.piece{margin:0 -16px;padding-left:16px;padding-right:16px;transition:background .2s}
  fieldset.selected{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  fieldset.selected legend{color:var(--accent)}

  .field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px}
  .field > input[type=range]{grid-column:1 / -1}
  .num{display:flex;align-items:baseline;gap:3px;color:var(--text-dim)}
  .num input{width:46px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--text);
             font:inherit;font-variant-numeric:tabular-nums;text-align:right;-moz-appearance:textfield;appearance:textfield}
  .num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .num input:hover{border-color:var(--line-strong)}
  .num input:focus{border-color:var(--accent);outline:none}
  .num .unit{width:18px;font-size:12px}

  /* range: thin track, filled up to the thumb with the accent */
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
    background:linear-gradient(to right,var(--accent) var(--p,50%),var(--line-strong) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;
    background:#fff;border:0;box-shadow:0 1px 4px rgb(0 0 0/.4);transition:transform .15s}
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-strong)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgb(0 0 0/.4)}

  .text-input{width:110px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--text);
              font:13px ui-monospace,monospace;letter-spacing:.08em}
  .text-input:hover{border-color:var(--line-strong)}
  .text-input:focus{border-color:var(--accent);outline:none}

  /* on/off switch */
  .switch{-webkit-appearance:none;appearance:none;width:32px;height:18px;margin:0;border-radius:9px;background:var(--line-strong);
          position:relative;cursor:pointer;transition:background .2s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;
                 box-shadow:0 1px 3px rgb(0 0 0/.4);transition:transform .25s var(--ease)}
  .switch:checked{background:var(--accent)}
  .switch:checked::after{transform:translateX(14px)}

  .swatch-row{display:flex;align-items:center;gap:8px}
  .swatch-row code{color:var(--text-dim);font:12px ui-monospace,monospace;text-transform:uppercase}
  input[type=color]{-webkit-appearance:none;appearance:none;width:28px;height:28px;padding:0;border:1px solid var(--line-strong);
                    border-radius:8px;background:none;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
  input[type=color]::-moz-color-swatch{border:0;border-radius:5px}

  .bg-row{display:flex;align-items:center;gap:8px}
  #bgThumb{width:44px;height:28px;border-radius:6px;border:1px solid var(--line-strong);background:#0a0a0a center/cover;flex:none}
  .btn{padding:5px 10px;border-radius:7px;border:1px solid var(--line-strong);background:var(--field);cursor:pointer;transition:background .15s}
  .btn:hover{background:rgb(255 255 255/.12)}
  .btn:disabled{opacity:.4;cursor:default;background:var(--field)}
  .btn.wide{width:100%}
  .hint{margin:0;color:var(--text-dim);font-size:12px}

  /* "Add picture" button and its menu (a popover, so the panel's scroll area can't clip it) */
  .add-btn{display:flex;align-items:center;gap:7px;padding:7px 10px}
  .add-btn .chev{margin-left:auto;color:var(--text-dim);transition:transform .25s var(--ease)}
  .add-btn:has(+ :popover-open) .chev{transform:rotate(180deg)}
  .add-btn:has(+ :popover-open){border-color:var(--accent)}
  #addMenu{position:fixed;inset:auto;margin:0;padding:5px;box-sizing:border-box;border-radius:11px;border:1px solid var(--line-strong);
           background:rgb(22 22 27/.94);backdrop-filter:blur(16px) saturate(1.2);color:var(--text);
           box-shadow:0 14px 40px rgb(0 0 0/.5),0 2px 6px rgb(0 0 0/.3);
           opacity:1;transform:none;transition:opacity .16s var(--ease),transform .2s var(--ease),display .2s allow-discrete,overlay .2s allow-discrete}
  #addMenu:not(:popover-open){opacity:0;transform:translateY(-4px) scale(.98)}
  @starting-style{#addMenu:popover-open{opacity:0;transform:translateY(-4px) scale(.98)}}
  #addMenu [role=menuitem]{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;border-radius:7px;background:none;
                           text-align:left;cursor:pointer;outline:none}
  #addMenu [role=menuitem]:hover,#addMenu [role=menuitem]:focus-visible{background:rgb(255 255 255/.08)}
  #addMenu [role=menuitem]:focus-visible{box-shadow:inset 0 0 0 1px var(--accent)}
  #addMenu .thumb{position:static;flex:none;width:44px;height:30px;border-radius:5px;background:#0a0a0a;border:1px solid var(--line)}
  #addMenu .thumb.icon{display:grid;place-items:center;color:var(--text-dim)}
  #addMenu .label{display:grid;gap:1px;min-width:0}
  #addMenu .label small{color:var(--text-dim);font-size:11.5px}
  #addMenu .on{margin-left:auto;color:var(--text-dim);font-size:11.5px}
  #addMenu hr{margin:5px 3px;border:0;border-top:1px solid var(--line)}
  .piece legend{display:flex;align-items:center}
  .piece legend .remove{margin-left:auto;padding:0;border:0;background:none;color:var(--text-dim);font-size:11px;text-transform:none;letter-spacing:0;cursor:pointer}
  .piece legend .remove:hover{color:var(--text);text-decoration:underline}

  #panel footer{padding:12px 16px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
  #save{padding:9px 12px;border-radius:9px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;
        box-shadow:0 4px 14px rgb(0 0 0/.3);transition:filter .15s,transform .1s}
  #save:hover{filter:brightness(1.08)}
  #save:active{transform:translateY(1px)}
  #saveNote{margin:0;color:var(--text-dim);font-size:12px}
  #saveNote code{font:11.5px ui-monospace,monospace;color:var(--text);word-break:break-all}
  #saveNote.done strong{color:var(--text)}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none !important}}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div id="frost"></div>
<canvas id="c"></canvas>
<button id="fab" aria-label="Wallpaper settings" aria-expanded="false" aria-controls="panel" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
    <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
  </svg>
</button>
<section id="panel" role="dialog" aria-labelledby="panelTitle" tabindex="-1" hidden>
  <header>
    <div>
      <h2 id="panelTitle">Wallpaper</h2>
      <p>While this panel is open, click a picture on the screen to move, resize or rotate it.</p>
    </div>
    <button class="icon-btn" id="close" aria-label="Close settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="body">
    <fieldset data-group="pictures">
      <legend>Pictures</legend>
      <p id="noPieces" class="hint" hidden>Nothing on screen yet. Add a picture to start.</p>
      <button class="btn wide add-btn" id="addBtn" popovertarget="addMenu" aria-haspopup="menu">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add picture
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="addMenu" popover role="menu" aria-label="Add picture"></div>
      <input id="addFile" type="file" accept="image/*" hidden>
    </fieldset>
    <fieldset data-group="digits">
      <legend>Digits</legend>
      <div class="field"><label for="digits">Characters</label><input id="digits" class="text-input" type="text" maxlength="16" placeholder="01" spellcheck="false"></div>
      <div class="field"><label for="bold">Bold</label><input id="bold" class="switch" type="checkbox" role="switch"></div>
    </fieldset>
    <fieldset data-group="glow">
      <legend>Glow</legend>
      <div class="field"><label for="glow">Color</label><span class="swatch-row"><code id="glowHex"></code><input id="glow" type="color"></span></div>
    </fieldset>
    <fieldset data-group="background">
      <legend>Background</legend>
      <div class="field"><span>Image</span>
        <span class="bg-row"><span id="bgThumb"></span><button class="btn" id="bgPick">Choose</button><button class="btn" id="bgNone">Remove</button></span>
      </div>
      <input id="bgFile" type="file" accept="image/*" hidden>
    </fieldset>
  </div>
  <footer>
    <button id="save">Save for wallpaper</button>
    <p id="saveNote" aria-live="polite">Downloads <code>davinci.html</code>, then install it with <code>./install.sh ~/Downloads/davinci.html</code></p>
  </footer>
</section>

const images = {}; // src -> canvas with the background cleared, once loaded
/** Load a picture once; the grid rebuilds when it's ready. */
function loadImage(src) {
  if (src in images) return;
  images[src] = null;
  const im = new Image();
  im.onload = () => { images[src] = clearBackground(im); queueBuild(); };
  im.src = BUILTIN[src] || src;
}
/**
 * Make the background see-through: flood-fill from every edge through pixels close to the corner color.
 * Only touches background connected to the edges, so a white robot on white keeps its white body.
 * Skipped for dark backgrounds (like the hands): they turn into nothing anyway, and the fill would eat dim edges.
 */
function clearBackground(im) {
  const c = document.createElement('canvas');
  const w = c.width = im.naturalWidth, h = c.height = im.naturalHeight;
  const g = c.getContext('2d', {willReadFrequently: true});
  g.drawImage(im, 0, 0);
  const data = g.getImageData(0, 0, w, h), px = data.data;
  const ref = [px[0], px[1], px[2]], TOL = 40;
  if ((ref[0] * 0.3 + ref[1] * 0.59 + ref[2] * 0.11) * (px[3] / 255) <= 18) return c;
  const near = p => Math.abs(px[p*4] - ref[0]) < TOL && Math.abs(px[p*4+1] - ref[1]) < TOL && Math.abs(px[p*4+2] - ref[2]) < TOL;
  const seen = new Uint8Array(w * h), stack = [];
  for (let x = 0; x < w; x++) stack.push(x, (h - 1) * w + x);
  for (let y = 0; y < h; y++) stack.push(y * w, y * w + w - 1);
  while (stack.length) {
    const p = stack.pop();
    if (seen[p] || !near(p)) continue;
    seen[p] = 1;
    px[p*4+3] = 0;
    const x = p % w;
    if (x > 0) stack.push(p - 1);
    if (x < w - 1) stack.push(p + 1);
    if (p >= w) stack.push(p - w);
    if (p < w * (h - 1)) stack.push(p + w);
  }
  g.putImageData(data, 0, 0);
  return c;
}
/** The [start, width] slice of a picture's image it uses; the hands each use half of the painting. */
const slice = p => [p.sx ?? 0, p.sw ?? images[p.src].width];
/** Screen scale at size 1. The hands fit as the whole painting, so they stay in proportion to each other. */
const pieceFit = (p, w, h) => {
  const im = images[p.src];
  return Math.min(w / (p.src === 'hands' ? im.width : slice(p)[1]), h / im.height);
};
/** Pick a random character from the digit set. */
function randomDigit() {
  const set = settings.digits || '01';
  return set[Math.floor(Math.random() * set.length)];
}

/** Push the settings that don't change the digit grid into the page and redraw. */
function applySettings() {
  const d = settings.dim;
  document.body.style.background = settings.background
    ? `linear-gradient(rgb(0 0 0/${d}),rgb(0 0 0/${d})),url(${settings.background}) center/cover`
    : '';
  frost.style.backdropFilter = `blur(${settings.frostBlur}px)`;
  frost.style.background = `rgb(0 0 0/${settings.frostShadow})`;
  glowRGB = [1, 3, 5].map(i => parseInt(settings.glow.slice(i, i + 2), 16));
  const [r, g, b] = glowRGB, root = document.documentElement.style;
  root.setProperty('--accent', settings.glow);
  root.setProperty('--on-accent', r * .299 + g * .587 + b * .114 > 150 ? '#111' : '#fff'); // readable text on the accent
  for (const c of cells) c.ch = randomDigit();
  lastMove = performance.now();
  afterBuild(); // selection boxes use the glow color too
}

let buildQueued = false;
/** Rebuild the grid at most once per frame, so dragging and sliders stay smooth. */
function queueBuild() {
  if (buildQueued) return;
  buildQueued = true;
  requestAnimationFrame(() => { buildQueued = false; build(); });
}

function build() {
  const dpr = devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight, CELL = settings.spacing;
  if (!w || !h) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Draw each picture on its own layer (moved, sized, rotated, mirrored) so every digit
  // knows which picture it belongs to. Size 1 = the picture fitted to the screen.
  settings.pieces.forEach(p => loadImage(p.src));
  const shown = settings.pieces.filter(p => images[p.src]); // still-loading ones join when they load
  const layers = shown.map(p => {
    const im = images[p.src], {key} = p, [sx, sw] = slice(p);
    const fit = pieceFit(p, w, h);
    const layer = document.createElement('canvas');
    layer.width = w; layer.height = h;
    const g = layer.getContext('2d', {willReadFrequently: true});
    const nw = sw * fit, nh = im.height * fit, k = settings[key + 'size'];
    g.translate(settings[key + 'x'] * w, settings[key + 'y'] * h);
    g.rotate(settings[key + 'rot'] * Math.PI / 180);
    g.scale(settings[key + 'flip'] ? -k : k, k);
    g.drawImage(im, sx, 0, sw, im.height, -nw / 2, -nh / 2, nw, nh);
    return g.getImageData(0, 0, w, h).data;
  });

  const floor = settings.brightness;
  cells = [];
  lastMove = performance.now(); // make sure the fresh grid gets drawn
  for (let y = CELL / 2; y < h; y += CELL) {
    for (let x = CELL / 2; x < w; x += CELL) {
      const i = ((y | 0) * w + (x | 0)) * 4;
      // where pictures overlap, the brighter one wins, so neither's dark background covers the other
      let lum = 0, top = 0;
      layers.forEach((px, n) => {
        const v = (px[i] * 0.3 + px[i+1] * 0.59 + px[i+2] * 0.11) * (px[i+3] / 255);
        if (v > lum) { lum = v; top = n; }
      });
      if (lum > 18) {
        cells.push({
          x, y, key: shown[top].key,
          ch: randomDigit(),
          base: (floor + (lum / 255) * (1 - floor)) * 255,  // gray level from the painting
          heat: 0,
        });
      }
    }
  }
  // Soft-edged silhouette of the digit grid, used as the mask for the frosted sky.
  // Drawn at quarter size: it's blurred anyway, and it keeps rebuilds fast while dragging.
  const q = 4, sh = document.createElement('canvas');

  shc.fillStyle = '#000';

  mk.width = sh.width; mk.height = sh.height;

  mkc.drawImage(sh, 0, 0);
  const url = `url(${mk.toDataURL()})`;
  frost.style.webkitMaskImage = frost.style.maskImage = url;
  draw(); // resizing the canvas blanked it; don't wait a frame (would flicker while dragging)
  afterBuild();
}

function frame() {
  requestAnimationFrame(frame);
  if (performance.now() - lastMove > 3000) return; // glow fully faded by now
  draw();
}

function draw() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.font = `${settings.bold ? 'bold ' : ''}${settings.fontSize}px ui-monospace, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const R = settings.glowRadius; // scramble radius around cursor
  const [gr, gg, gb] = glowRGB;
  for (const c of cells) {
    const d = Math.hypot(c.x - mouse.x, c.y - mouse.y);
    if (d < R) {
      c.heat = Math.max(c.heat, 1 - d / R);
      if (Math.random() < c.heat * 0.4) c.ch = randomDigit();
    }
    c.heat *= 0.94; // cool down
    // blend from the digit's gray toward the glow color as it heats up
    const t = c.heat, b = c.base;
    ctx.fillStyle = `rgb(${b + (gr - b) * t} ${b + (gg - b) * t} ${b + (gb - b) * t})`;

  /** Append a slider row for settings[key] to a panel section; double-click resets it to def. */

  /** Screen geometry of a picture's box: corners, rotate handle, and a screen-to-picture coordinate mapper. Null while loading. */
  function geom(key) {
    const p = pieceOf(key), im = p && images[p.src];

      return [f * (dx * cos + dy * sin) / k, (-dx * sin + dy * cos) / k];

      cx, cy, lx0, lx1, ly0, ly1, toLocal, top,
      corners: [[lx0, ly0], [lx1, ly0], [lx1, ly1], [lx0, ly1]].map(p => toScreen(...p)),

    const k = hit.key, up = (e.deltaY || e.deltaX) < 0; // Shift+wheel reports deltaX in some browsers
    if (e.shiftKey) {
      settings[k + 'rot'] = ((settings[k + 'rot'] + (up ? -3 : 3) + 540) % 360) - 180;
    } else {
      settings[k + 'size'] = Math.min(3, Math.max(0.2, settings[k + 'size'] * (up ? 1.05 : 1 / 1.05)));
    }
    select(k);
    syncPiece(k);
    queueBuild();
  }, {passive: false});

  // Arrow keys nudge the selected picture (Shift for 10px); ignored while typing in the panel.
  addEventListener('keydown', e => {
    if (!editing || !selected || e.target.matches('input, textarea')) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removePiece(selected); return; }
    const step = e.shiftKey ? 10 : 1;
    const d = {ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step]}[e.key];
    if (!d) return;
    e.preventDefault();
    settings[selected + 'x'] += d[0] / innerWidth;
    settings[selected + 'y'] += d[1] / innerHeight;
    queueBuild();
  });

  // Write this same page with the new settings baked in, for ./install.sh to pick up.
  $('save').onclick = () => {
    const open = '<script id="settings" type="application/json">';
    const start = pageSource.indexOf(open) + open.length;
    const end = pageSource.indexOf('</' + 'script>', start);
    const out = pageSource.slice(0, start) + JSON.stringify(settings) + pageSource.slice(end);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], {type: 'text/html'}));
    a.download = 'davinci.html';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); // Firefox needs the URL alive while it starts the download
    note.classList.add('done');
    note.innerHTML = '<strong>Saved to your downloads.</strong> Install it with <code>./install.sh ~/Downloads/davinci.html</code>';
  };
}
</script>
</body>
</html>
