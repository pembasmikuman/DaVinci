11VVXXXXVVVddddV/FYKrrrrqqquuuuqqq6666r8K/whQDGVYTqlqOAAAAABJRU5ErkJggg==';
img.onload = build;

function build() {
  const dpr = devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (!w || !h || !img.complete) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // draw image to offscreen canvas, scaled to fit (contain), centered
  const m = document.createElement('canvas');
  m.width = w; m.height = h;
  const mc = m.getContext('2d');
  const s = Math.min(w / img.width, h / img.height) * 0.96;
  const iw = img.width * s, ih = img.height * s;
  mc.drawImage(img, (w - iw) / 2, (h - ih) / 2, iw, ih);
  const px = mc.getImageData(0, 0, w, h).data;

  cells = [];
  lastMove = performance.now(); // make sure the fresh grid gets drawn
  for (let y = CELL / 2; y < h; y += CELL) {
    for (let x = CELL / 2; x < w; x += CELL) {
      const i = ((y | 0) * w + (x | 0)) * 4;
      const lum = (px[i] * 0.3 + px[i+1] * 0.59 + px[i+2] * 0.11) * (px[i+3] / 255);
      if (lum > 18) {
        cells.push({
          x, y,
          ch: Math.random() < 0.5 ? '0' : '1',
          base: 30 + (lum / 255) * 65,  // shading from image
          heat: 0,
        });
      }
    }
  }
}

function frame() {
  requestAnimationFrame(frame);
  if (performance.now() - lastMove > 3000) return; // glow fully faded by now
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.font = `${FONT}px ui-monospace, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const R = 220; // scramble radius around cursor
  for (const c of cells) {
    const d = Math.hypot(c.x - mouse.x, c.y - mouse.y);
    if (d < R) {
      c.heat = Math.max(c.heat, 1 - d / R);
      if (Math.random() < c.heat * 0.4) c.ch = c.ch === '0' ? '1' : '0';
    }
    c.heat *= 0.94; // cool down
    const l = c.base + c.heat * (95 - c.base);
    const s = 8 + c.heat * 85;               // cool: near-gray, hot: saturated
    ctx.fillStyle = `hsl(14 ${s}% ${l}%)`;   // Laravel red-orange

    ctx.fillText(c.ch, c.x, c.y);
  }
}

addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; lastMove = performance.now(); });
addEventListener('mouseleave', () => { mouse.x = mouse.y = -1e4; });
addEventListener('resize', build);
frame();
</script>
